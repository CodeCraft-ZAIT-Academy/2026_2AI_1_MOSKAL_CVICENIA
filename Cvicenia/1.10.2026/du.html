<style>
    .search-box {
        margin: 0 auto; 
        gap: 5px;
        width: 300px;
        align-items: center;
        display: flex;
        border: 1px solid #ccc;
        margin-bottom: 15px;
    }
    .circle-img {
        border-radius: 50%;
        height: 20px;
        width: 20px;
        object-fit: cover;
        margin-left: 2px;
    }
    .search-bar {
        flex: 1;
        background-color: #f5f8fa;
        font-size: 16px;
        outline: none;
        border: none;
        color: black;
        margin: 2px;
    }
    .search-bar::placeholder {
        color: black;
    }
    .search-bar:focus::placeholder {
        opacity: 0;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 0 auto;
    }
    .card img {
        width: 100%;
        aspect-ratio: 3/4;
        object-fit: cover;
    }

    
    .container {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        align-items: flex-start;
    }

    .avatar {
        width: 28px !important;
        height: 28px !important;
        aspect-ratio: 1/1 !important;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
    }

    .card-info {
        flex: 1;
    }

    .title {
        font-size: 13px;
        font-weight: bold;
        margin: 0 0 2px 0;
        line-height: 1.2;
    }

    .sub-text {
        font-size: 11px;
        color: #777;
        margin: 0;
        line-height: 1.3;
    }

    .more-options {
        color: #777;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        line-height: 1;
    }
</style>
