<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
</head>

<body>
    <div style="display: flex; flex-direction: row;">

        <div style="background-color: rgb(51, 255, 0);">div1</div>
        <div style="background-color: rgb(106, 151, 109);">div2
            <p>thus is a paragraph</p>
        </div>
    </div>
    <div style="display: flex; flex-direction: row; margin-top: 30px;">

        <div style="background-color: rgb(0, 4, 255); width: 100px;">div1</div>
        <div style="background-color: rgb(151, 106, 112); flex: 1;">div2</div>

    </div>

    <div
        style="display: flex; flex-direction: row; margin-top: 30px; height: 70px; border-width: 1px; border-style: solid; border-color: grey; justify-content: start;">

        <div style="background-color: rgb(52, 3, 156); width: 100px;">div1</div>
        <div style="background-color: rgb(227, 17, 17); width: 100px;">div2</div>

    </div>


</body>

</html>
